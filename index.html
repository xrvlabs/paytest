<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora Pay · Scan & Pay</title>
    <style>
        :root {
            --bg: #070913;
            --card-bg: rgba(20, 25, 42, 0.7);
            --border: rgba(255, 255, 255, 0.1);
            --accent: #00c8ff;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text: #f3f4f6;
            --muted: #9ca3af;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(0, 200, 255, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(239, 68, 68, 0.08) 0%, transparent 50%);
        }

        .pay-card {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 28px 24px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .brand-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }
        .brand-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #00c8ff, #3b82f6);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }
        .brand-name {
            font-size: 1.1rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #93c5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .amount-display {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
        }
        .amount-label {
            font-size: 0.72rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .amount-val {
            font-size: 2.2rem;
            font-weight: 800;
            color: #7dd3fc;
        }

        .qr-wrapper {
            background: #ffffff;
            padding: 14px;
            border-radius: 18px;
            display: inline-block;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            margin-bottom: 18px;
        }
        .qr-wrapper img {
            width: 210px;
            height: 210px;
            display: block;
            border-radius: 8px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 0.82rem;
            font-weight: 700;
            transition: all 0.3s ease;
        }
        .status-PENDING {
            color: #fcd34d;
            background: rgba(245, 158, 11, 0.12);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }
        .status-SUCCESS {
            color: #6ee7b7;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.35);
        }
        .status-TAMPERED {
            color: #fca5a5;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.35);
        }

        .spinner {
            width: 12px;
            height: 12px;
            border: 2px solid currentColor;
            border-bottom-color: transparent;
            border-radius: 50%;
            display: inline-block;
            animation: rotation 1s linear infinite;
        }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .app-icons {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
            font-size: 0.72rem;
            color: var(--muted);
        }
    </style>
</head>
<body>

<div class="pay-card">
    <div class="brand-header">
        <div class="brand-icon">⚡</div>
        <div class="brand-name">Aurora Pay</div>
    </div>

    <div class="amount-display">
        <div class="amount-label" id="shopName">Payment Amount</div>
        <div class="amount-val" id="displayAmount">₹1.00</div>
    </div>

    <div class="qr-wrapper">
        <img id="qrImg" src="https://api.qrserver.com/v1/create-qr-code/?size=280x280&data=loading" alt="UPI QR Code">
    </div>

    <div>
        <div class="status-badge status-PENDING" id="statusBadge">
            <span class="spinner" id="statusSpinner"></span>
            <span id="statusText">Scan QR using any UPI App</span>
        </div>
    </div>

    <div class="app-icons">
        Paytm • PhonePe • Google Pay • BHIM
    </div>
</div>

<script>
    const baseUrl = 'https://paytmgateway.dcodesharvi.workers.dev';
    const amount = '1.00'; // Target transaction amount

    let pollInterval = null;

    async function initPayment() {
        try {
            // Request dynamic QR from backend
            const res = await fetch(`${baseUrl}/api/create-order`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ amount: amount })
            });
            const data = await res.json();

            if (data.success) {
                document.getElementById('qrImg').src = data.qr_image_url;
                document.getElementById('displayAmount').innerText = '₹' + parseFloat(data.amount).toFixed(2);
                if (data.shop_name) document.getElementById('shopName').innerText = data.shop_name;

                // Start polling verification status
                startStatusPolling(data.mid, data.order_id, data.amount);
            }
        } catch (err) {
            console.error(err);
        }
    }

    function startStatusPolling(mid, orderId, amount) {
        if (pollInterval) clearInterval(pollInterval);

        pollInterval = setInterval(async () => {
            try {
                const res = await fetch(`${baseUrl}/api/check-status`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mid: mid, order_id: orderId, expected_amount: amount })
                });
                const data = await res.json();
                const badge = document.getElementById('statusBadge');
                const text = document.getElementById('statusText');
                const spinner = document.getElementById('statusSpinner');

                if (data.status === 'TXN_SUCCESS') {
                    badge.className = 'status-badge status-SUCCESS';
                    text.innerText = '✅ Payment Verified!';
                    spinner.style.display = 'none';
                    clearInterval(pollInterval);
                } else if (data.status === 'TAMPERED_PARTIAL') {
                    badge.className = 'status-badge status-TAMPERED';
                    text.innerText = `⚠️ Amount Tampered (₹${data.received_amount})`;
                    spinner.style.display = 'none';
                    clearInterval(pollInterval);
                }
            } catch (e) {}
        }, 3000);
    }

    // Auto start
    initPayment();
</script>

</body>
</html>
